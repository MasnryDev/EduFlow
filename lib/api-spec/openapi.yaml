openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Teacher Resource Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: profile
    description: User profile management
  - name: resources
    description: Teaching resource management
  - name: generate
    description: AI resource generation
  - name: stats
    description: User statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List user's resources
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createResource
      tags: [resources]
      summary: Save a generated resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a single resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate:
    post:
      operationId: generateResource
      tags: [generate]
      summary: Generate a teaching resource using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateOutput"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get user statistics
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        profileImage:
          type: ["string", "null"]
      required:
        - id

    Profile:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        email:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - createdAt

    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string

    Resource:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        title:
          type: string
        resourceType:
          type: string
        subject:
          type: string
        yearLevel:
          type: string
        topic:
          type: string
        learningObjectives:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        difficulty:
          type: ["string", "null"]
        additionalInstructions:
          type: ["string", "null"]
        aiResponse:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - resourceType
        - subject
        - yearLevel
        - topic
        - aiResponse
        - createdAt
        - updatedAt

    ResourceList:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
      required:
        - resources
        - total
        - page
        - limit

    ResourceInput:
      type: object
      properties:
        title:
          type: string
        resourceType:
          type: string
        subject:
          type: string
        yearLevel:
          type: string
        topic:
          type: string
        learningObjectives:
          type: string
        duration:
          type: string
        difficulty:
          type: string
        additionalInstructions:
          type: string
        aiResponse:
          type: string
      required:
        - title
        - resourceType
        - subject
        - yearLevel
        - topic
        - aiResponse

    ResourceUpdate:
      type: object
      properties:
        title:
          type: string
        aiResponse:
          type: string

    GenerateInput:
      type: object
      properties:
        resourceType:
          type: string
        subject:
          type: string
        yearLevel:
          type: string
        topic:
          type: string
        learningObjectives:
          type: string
        duration:
          type: string
        difficulty:
          type: string
        additionalInstructions:
          type: string
      required:
        - resourceType
        - subject
        - yearLevel
        - topic

    GenerateOutput:
      type: object
      properties:
        content:
          type: string
        title:
          type: string
      required:
        - content
        - title

    ResourceTypeStat:
      type: object
      properties:
        resourceType:
          type: string
        count:
          type: number
      required:
        - resourceType
        - count

    Stats:
      type: object
      properties:
        totalResources:
          type: number
        resourcesByType:
          type: array
          items:
            $ref: "#/components/schemas/ResourceTypeStat"
        recentResources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
      required:
        - totalResources
        - resourcesByType
        - recentResources
